<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Witch's Maze 🧙</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a0a2e;
    font-family: 'Nunito', sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  #stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle 2s infinite alternate;
  }

  @keyframes twinkle {
    from { opacity: 0.2; }
    to { opacity: 1; }
  }

  #game-wrapper {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  #title {
    font-family: 'Fredoka One', cursive;
    color: #f9e; 
    font-size: clamp(20px, 4vw, 36px);
    text-shadow: 0 0 20px #c060ff, 0 0 40px #c060ff;
    letter-spacing: 2px;
  }

  #hud {
    display: flex;
    gap: 18px;
    align-items: center;
  }

  .ability-box {
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 14px;
    padding: 6px 14px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
    min-width: 72px;
  }

  .ability-box:hover { background: rgba(255,255,255,0.15); transform: scale(1.05); }
  .ability-box:active { transform: scale(0.96); }

  .ability-box.used {
    opacity: 0.35;
    filter: grayscale(1);
    cursor: not-allowed;
  }

  .ability-icon { font-size: 22px; }
  .ability-name { font-size: 11px; font-weight: 700; color: #fff; }
  .ability-count { font-size: 14px; font-weight: 800; color: #ffe44d; }

  #canvas-container {
    position: relative;
  }

  canvas {
    border-radius: 18px;
    border: 3px solid rgba(200,100,255,0.4);
    box-shadow: 0 0 40px rgba(160,60,255,0.3);
    display: block;
  }

  #message-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 18px;
    background: rgba(10,5,25,0.82);
    backdrop-filter: blur(4px);
    gap: 14px;
    z-index: 10;
  }

  #message-overlay.hidden { display: none; }

  #message-title {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(28px, 5vw, 52px);
    color: #ffe44d;
    text-shadow: 0 0 20px #ff9900;
    text-align: center;
    padding: 0 20px;
  }

  #message-sub {
    font-size: clamp(13px, 2vw, 18px);
    color: #ddd;
    text-align: center;
    padding: 0 20px;
    max-width: 340px;
    line-height: 1.5;
  }

  #restart-btn {
    font-family: 'Fredoka One', cursive;
    font-size: 20px;
    padding: 12px 36px;
    border-radius: 40px;
    border: none;
    background: linear-gradient(135deg, #c060ff, #7030d0);
    color: white;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(180,80,255,0.5);
    transition: transform 0.15s, box-shadow 0.15s;
  }

  #restart-btn:hover { transform: scale(1.07); box-shadow: 0 6px 28px rgba(180,80,255,0.7); }
  #restart-btn:active { transform: scale(0.96); }

  #instructions {
    font-size: 12px;
    color: rgba(255,255,255,0.45);
    text-align: center;
  }
</style>
</head>
<body>

<div id="stars"></div>

<div id="game-wrapper">
  <div id="title">🧙 The Witch's Maze 🏠</div>

  <div id="hud">
    <div class="ability-box" id="btn-jump" onclick="useAbility('jump')">
      <div class="ability-icon">⬆️</div>
      <div class="ability-name">JUMP</div>
      <div class="ability-count" id="count-jump">3</div>
    </div>
    <div class="ability-box" id="btn-fly" onclick="useAbility('fly')">
      <div class="ability-icon">🦋</div>
      <div class="ability-name">FLY</div>
      <div class="ability-count" id="count-fly">3</div>
    </div>
    <div class="ability-box" id="btn-dig" onclick="useAbility('dig')">
      <div class="ability-icon">⛏️</div>
      <div class="ability-name">DIG</div>
      <div class="ability-count" id="count-dig">3</div>
    </div>
    <div style="background:rgba(255,255,255,0.08);border:2px solid rgba(255,255,255,0.2);border-radius:14px;padding:6px 14px;text-align:center;min-width:72px;">
      <div class="ability-icon">❤️</div>
      <div class="ability-name">LIVES</div>
      <div class="ability-count" id="lives-display">3</div>
    </div>
  </div>

  <div id="canvas-container">
    <canvas id="gameCanvas"></canvas>

    <div id="message-overlay">
      <div id="message-title">🧙 THE WITCH'S MAZE</div>
      <div id="message-sub">Escape through the spiral — avoid the Witch, Wolf & Deer!<br>Use Jump, Fly & Dig to get through obstacles!<br><br>🖱️ Click to move • ⌨️ Arrow keys / WASD</div>
      <button id="restart-btn" onclick="startGame()">▶ START GAME</button>
    </div>
  </div>

  <div id="instructions">Arrow keys / WASD to move • Click buttons or press [J] [F] [D] for abilities</div>
</div>

<script>
// ===== STAR BACKGROUND =====
const starsDiv = document.getElementById('stars');
for (let i = 0; i < 80; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const size = Math.random() * 3 + 1;
  s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*2}s;animation-duration:${1.5+Math.random()*2}s`;
  starsDiv.appendChild(s);
}

// ===== CANVAS SETUP =====
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const maxW = Math.min(window.innerWidth - 40, 620);
  const maxH = Math.min(window.innerHeight - 200, 520);
  const size = Math.min(maxW, maxH);
  canvas.width = size;
  canvas.height = size;
}
resizeCanvas();
window.addEventListener('resize', () => { resizeCanvas(); if (gameState !== 'playing') drawStatic(); });

// ===== GAME STATE =====
let gameState = 'menu'; // menu, playing, win, lose
let player, abilities, lives, enemies, particles, cameraAngle;
let animFrame;
let keys = {};

const MAZE_RINGS = 5;
const PLAYER_RADIUS = 10;
const ENEMY_RADIUS = 12;

function getCenterX() { return canvas.width / 2; }
function getCenterY() { return canvas.height / 2; }
function getMaxR() { return Math.min(canvas.width, canvas.height) * 0.46; }
function getRingWidth() { return getMaxR() / (MAZE_RINGS + 0.5); }

// Maze gaps - each ring has a gap (angle in radians) for the path
const RING_GAPS = [
  { angle: Math.PI * 0.1,  width: 0.38 },  // innermost
  { angle: Math.PI * 0.9,  width: 0.38 },
  { angle: Math.PI * 1.7,  width: 0.35 },
  { angle: Math.PI * 0.5,  width: 0.35 },
  { angle: Math.PI * 1.3,  width: 0.32 },  // outermost
];

// Obstacles on the path
const OBSTACLE_DEFS = [
  { ring: 0, angle: Math.PI * 1.5, type: 'wolf',   emoji: '🐺', label: 'Wolf!' },
  { ring: 1, angle: Math.PI * 0.3, type: 'witch',  emoji: '🧙', label: 'Witch!' },
  { ring: 2, angle: Math.PI * 1.2, type: 'deer',   emoji: '🦌', label: 'Deer!' },
  { ring: 3, angle: Math.PI * 0.7, type: 'croc',   emoji: '🐊', label: 'Crocodile!' },
];

// Collectibles / landmarks
const LANDMARK_DEFS = [
  { ring: 1, angle: Math.PI * 1.8, emoji: '🏚️', label: 'Chicken House' },
  { ring: 2, angle: Math.PI * 0.6, emoji: '🌿', label: 'Forest' },
  { ring: 3, angle: Math.PI * 1.5, emoji: '🌀', label: 'Longest Crocodile path' },
];

function polarToXY(ring, angle, rOffset = 0) {
  const rw = getRingWidth();
  const r = (ring + 0.5) * rw + rOffset;
  return {
    x: getCenterX() + r * Math.cos(angle),
    y: getCenterY() + r * Math.sin(angle)
  };
}

function startGame() {
  document.getElementById('message-overlay').classList.add('hidden');
  gameState = 'playing';

  // Player starts at ring 0, angle pointing to start gap
  const startAngle = RING_GAPS[0].angle;
  const startPos = polarToXY(0, startAngle + 0.01);
  player = {
    x: startPos.x,
    y: startPos.y,
    r: PLAYER_RADIUS,
    vx: 0,
    vy: 0,
    ring: 0,
    angle: startAngle + 0.01,
    isFlying: false,
    isDigging: false,
    flyTimer: 0,
    digTimer: 0,
    invincible: 0,
    trail: [],
  };

  abilities = { jump: 3, fly: 3, dig: 3 };
  lives = 3;
  enemies = OBSTACLE_DEFS.map(o => ({
    ...o,
    x: 0, y: 0,
    patrolAngle: o.angle,
    patrolDir: 1,
    patrolSpeed: 0.008 + Math.random() * 0.006,
  }));
  particles = [];
  cameraAngle = 0;

  updateHUD();
  if (animFrame) cancelAnimationFrame(animFrame);
  gameLoop();
}

function updateHUD() {
  document.getElementById('count-jump').textContent = abilities.jump;
  document.getElementById('count-fly').textContent = abilities.fly;
  document.getElementById('count-dig').textContent = abilities.dig;
  document.getElementById('lives-display').textContent = lives;
  ['jump','fly','dig'].forEach(a => {
    document.getElementById('btn-'+a).classList.toggle('used', abilities[a] <= 0);
  });
}

// ===== INPUT =====
document.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === 'j' || e.key === 'J') useAbility('jump');
  if (e.key === 'f' || e.key === 'F') useAbility('fly');
  if (e.key === 'd' || e.key === 'D') useAbility('dig');
  if (['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d',' '].includes(e.key.toLowerCase())) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

canvas.addEventListener('click', e => {
  if (gameState !== 'playing') return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const dx = mx - player.x;
  const dy = my - player.y;
  const dist = Math.sqrt(dx*dx+dy*dy);
  if (dist > 2) {
    player.vx = (dx/dist) * 3;
    player.vy = (dy/dist) * 3;
  }
});

function useAbility(type) {
  if (gameState !== 'playing' || abilities[type] <= 0) return;
  abilities[type]--;
  updateHUD();
  spawnParticles(player.x, player.y, type === 'jump' ? '#ffe44d' : type === 'fly' ? '#88eeff' : '#cc8844', 12);

  if (type === 'jump') {
    // Jump - big upward velocity burst
    player.vy -= 9;
    player.isFlying = true;
    player.flyTimer = 30;
  } else if (type === 'fly') {
    // Fly - float upward for longer
    player.isFlying = true;
    player.flyTimer = 90;
    player.vy = -2;
  } else if (type === 'dig') {
    // Dig - phase through next wall
    player.isDigging = true;
    player.digTimer = 60;
  }
}

// ===== COLLISION =====
function isInWall(x, y) {
  if (player.isDigging) return false;
  const cx = getCenterX(), cy = getCenterY();
  const dx = x - cx, dy = y - cy;
  const dist = Math.sqrt(dx*dx+dy*dy);
  const angle = Math.atan2(dy, dx);
  const rw = getRingWidth();

  for (let ring = 0; ring < MAZE_RINGS; ring++) {
    const innerR = ring * rw;
    const outerR = (ring + 1) * rw;
    const wallThick = rw * 0.18;

    // Check outer wall of this ring
    const wallR = outerR;
    if (Math.abs(dist - wallR) < wallThick) {
      // Check if there's a gap
      if (ring < RING_GAPS.length) {
        const gap = RING_GAPS[ring];
        let angleDiff = angle - gap.angle;
        while (angleDiff > Math.PI) angleDiff -= 2*Math.PI;
        while (angleDiff < -Math.PI) angleDiff += 2*Math.PI;
        if (Math.abs(angleDiff) < gap.width / 2) return false; // in gap
      }
      return true;
    }
  }
  return false;
}

// ===== PARTICLES =====
function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = 1 + Math.random() * 4;
    particles.push({ x, y, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd, life: 30+Math.random()*20, maxLife: 50, color, r: 2+Math.random()*3 });
  }
}

// ===== MAIN LOOP =====
let lastTime = 0;
function gameLoop(ts = 0) {
  const dt = Math.min((ts - lastTime) / 16.67, 3);
  lastTime = ts;

  update(dt);
  draw();
  animFrame = requestAnimationFrame(gameLoop);
}

function update(dt) {
  if (gameState !== 'playing') return;

  // Input
  const spd = 2.5;
  if (keys['arrowleft'] || keys['a']) player.vx -= 0.4 * dt;
  if (keys['arrowright'] || keys['d']) player.vx += 0.4 * dt;
  if (keys['arrowup'] || keys['w']) player.vy -= 0.4 * dt;
  if (keys['arrowdown'] || keys['s']) player.vy += 0.4 * dt;

  // Clamp speed
  const speed = Math.sqrt(player.vx**2 + player.vy**2);
  if (speed > spd) { player.vx = player.vx/speed*spd; player.vy = player.vy/speed*spd; }

  // Gravity (when not flying)
  if (player.flyTimer > 0) {
    player.flyTimer -= dt;
    if (player.flyTimer <= 0) { player.isFlying = false; }
  }
  if (player.digTimer > 0) {
    player.digTimer -= dt;
    if (player.digTimer <= 0) { player.isDigging = false; }
  }

  // Friction
  player.vx *= 0.88;
  player.vy *= 0.88;

  // Move
  let nx = player.x + player.vx * dt;
  let ny = player.y + player.vy * dt;

  // Wall collision
  if (isInWall(nx, ny)) {
    // Bounce
    if (!isInWall(player.x + player.vx*dt, player.y)) {
      ny = player.y;
      player.vy *= -0.5;
    } else if (!isInWall(player.x, player.y + player.vy*dt)) {
      nx = player.x;
      player.vx *= -0.5;
    } else {
      nx = player.x;
      ny = player.y;
      player.vx *= -0.6;
      player.vy *= -0.6;
    }
  }

  // Keep in canvas
  nx = Math.max(player.r, Math.min(canvas.width - player.r, nx));
  ny = Math.max(player.r, Math.min(canvas.height - player.r, ny));

  player.x = nx;
  player.y = ny;

  // Trail
  player.trail.push({ x: player.x, y: player.y });
  if (player.trail.length > 18) player.trail.shift();

  // Update enemy positions
  for (const e of enemies) {
    e.patrolAngle += e.patrolDir * e.patrolSpeed * dt;
    const pos = polarToXY(e.ring, e.patrolAngle);
    e.x = pos.x;
    e.y = pos.y;

    // Bounce at gap edges
    const gap = RING_GAPS[e.ring] || RING_GAPS[0];
    let angDiff = e.patrolAngle - gap.angle;
    while (angDiff > Math.PI) angDiff -= 2*Math.PI;
    while (angDiff < -Math.PI) angDiff += 2*Math.PI;
    if (Math.abs(angDiff) > Math.PI * 0.8) e.patrolDir *= -1;
  }

  // Check enemy collision
  if (player.invincible <= 0) {
    for (const e of enemies) {
      const dx = e.x - player.x, dy = e.y - player.y;
      if (dx*dx+dy*dy < (player.r + ENEMY_RADIUS)**2) {
        loseLife();
        break;
      }
    }
  } else {
    player.invincible -= dt;
  }

  // Check win condition - reach outer edge or center goal
  const cx = getCenterX(), cy = getCenterY();
  const distToCenter = Math.sqrt((player.x-cx)**2 + (player.y-cy)**2);
  const maxR = getMaxR();

  // Win = reach the finish area (bottom-left, outermost ring exit)
  const finishAngle = Math.PI * 1.1;
  const finishGap = RING_GAPS[MAZE_RINGS - 1];
  let angToFinish = Math.atan2(player.y - cy, player.x - cx);
  let angDiff = angToFinish - finishAngle;
  while (angDiff > Math.PI) angDiff -= 2*Math.PI;
  while (angDiff < -Math.PI) angDiff += 2*Math.PI;
  if (distToCenter > maxR * 0.88 && Math.abs(angDiff) < 0.3) {
    showMessage('🎉 YOU WIN! 🎉', "Amazing! You escaped the Witch's Maze! Your little hero made it!", true);
    spawnParticles(player.x, player.y, '#ffe44d', 40);
    gameState = 'win';
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.1;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function loseLife() {
  lives--;
  player.invincible = 120;
  spawnParticles(player.x, player.y, '#ff4466', 20);
  updateHUD();
  if (lives <= 0) {
    gameState = 'lose';
    showMessage('💀 Oh No!', 'The Witch caught you! Try again — you can do it!', false);
  }
}

function showMessage(title, sub, isWin) {
  const overlay = document.getElementById('message-overlay');
  overlay.classList.remove('hidden');
  document.getElementById('message-title').textContent = title;
  document.getElementById('message-sub').textContent = sub;
  document.getElementById('restart-btn').textContent = isWin ? '🌟 Play Again' : '🔄 Try Again';
}

// ===== DRAW =====
function drawStatic() {
  const cx = getCenterX(), cy = getCenterY();
  const maxR = getMaxR();
  const rw = getRingWidth();

  // Background
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxR * 1.3);
  grad.addColorStop(0, '#2a1045');
  grad.addColorStop(1, '#0d0520');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw maze rings
  for (let ring = 0; ring < MAZE_RINGS; ring++) {
    const r = (ring + 1) * rw;
    const gap = ring < RING_GAPS.length ? RING_GAPS[ring] : null;
    const gapW = gap ? gap.width / 2 : 0;
    const gapA = gap ? gap.angle : 0;

    ctx.beginPath();
    if (gap) {
      ctx.arc(cx, cy, r, gapA + gapW, gapA - gapW + Math.PI * 2);
    } else {
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
    }
    ctx.strokeStyle = ring % 2 === 0 ? 'rgba(180,90,255,0.7)' : 'rgba(120,60,200,0.7)';
    ctx.lineWidth = rw * 0.16;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  // Draw landmarks
  ctx.font = `${Math.max(14, canvas.width * 0.03)}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const lm of LANDMARK_DEFS) {
    const pos = polarToXY(lm.ring, lm.angle);
    ctx.fillText(lm.emoji, pos.x, pos.y);
  }

  // START label
  const startPos = polarToXY(0, RING_GAPS[0].angle);
  ctx.fillStyle = '#ffe44d';
  ctx.font = `bold ${Math.max(10, canvas.width * 0.022)}px Nunito`;
  ctx.fillText('START', cx + 10, cy + 10);

  // FINISH label
  const finishPos = polarToXY(MAZE_RINGS - 0.2, Math.PI * 1.1);
  ctx.fillStyle = '#88ff88';
  ctx.font = `bold ${Math.max(10, canvas.width * 0.022)}px Nunito`;
  ctx.fillText('🏁 FINISH', finishPos.x - 10, finishPos.y + 20);
}

function draw() {
  const cx = getCenterX(), cy = getCenterY();
  const rw = getRingWidth();

  drawStatic();

  if (gameState !== 'playing') return;

  // Draw enemies
  const emojiSize = Math.max(18, canvas.width * 0.038);
  ctx.font = `${emojiSize}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const e of enemies) {
    // Glow
    ctx.save();
    ctx.shadowColor = e.type === 'witch' ? '#ff44cc' : e.type === 'wolf' ? '#8844ff' : '#ff8800';
    ctx.shadowBlur = 18;
    ctx.fillText(e.emoji, e.x, e.y);
    ctx.restore();
  }

  // Particles
  for (const p of particles) {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fillStyle = p.color;
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Player trail
  for (let i = 0; i < player.trail.length; i++) {
    const t = player.trail[i];
    const alpha = (i / player.trail.length) * 0.4;
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(t.x, t.y, player.r * 0.6, 0, Math.PI*2);
    ctx.fillStyle = player.isDigging ? '#cc8844' : player.flyTimer > 0 ? '#88eeff' : '#c090ff';
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Player
  ctx.save();
  if (player.invincible > 0 && Math.floor(player.invincible / 6) % 2 === 0) {
    // Flicker when invincible
    ctx.globalAlpha = 0.3;
  }
  ctx.shadowColor = player.isDigging ? '#cc8844' : player.flyTimer > 0 ? '#88eeff' : '#ffffff';
  ctx.shadowBlur = 20;
  ctx.font = `${emojiSize * 1.1}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  // Show ability state on player
  const playerEmoji = player.isDigging ? '⛏️' : player.flyTimer > 0 ? '🦋' : '🧒';
  ctx.fillText(playerEmoji, player.x, player.y);
  ctx.restore();
  ctx.globalAlpha = 1;

  // Ability timer bars
  if (player.flyTimer > 0) {
    ctx.fillStyle = 'rgba(136,238,255,0.6)';
    ctx.fillRect(player.x - 15, player.y - player.r - 8, 30 * (player.flyTimer/90), 4);
  }
  if (player.digTimer > 0) {
    ctx.fillStyle = 'rgba(204,136,68,0.6)';
    ctx.fillRect(player.x - 15, player.y - player.r - 8, 30 * (player.digTimer/60), 4);
  }
}

// Initial draw
