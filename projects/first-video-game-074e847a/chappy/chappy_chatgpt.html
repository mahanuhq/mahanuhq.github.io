<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circular Maze Game</title>
<style>
  body { margin: 0; background: #111; color: white; font-family: Arial; text-align: center; }
  canvas { background: #222; display: block; margin: 0 auto; border: 2px solid white; }
  .controls { margin-top: 10px; }
</style>
</head>
<body>
<h2>Maze Adventure</h2>
<canvas id="game" width="500" height="500"></canvas>
<div class="controls">
<p>Controls: ⬆ Jump | ⬇ Dig | Space Fly</p>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let player = {
  angle: 0,
  radius: 200,
  speed: 0.01,
  yVel: 0,
  flying: false
};

let gravity = 0.2;
let obstacles = [];

function createObstacle(angle) {
  return {
    angle: angle,
    gap: Math.random() * 100 + 50
  };
}

for (let i = 0; i < 10; i++) {
  obstacles.push(createObstacle(i * 0.6));
}

function drawMaze() {
  ctx.beginPath();
  ctx.arc(250, 250, 200, 0, Math.PI * 2);
  ctx.strokeStyle = 'white';
  ctx.stroke();
}

function drawPlayer() {
  let x = 250 + Math.cos(player.angle) * player.radius;
  let y = 250 + Math.sin(player.angle) * player.radius;

  ctx.beginPath();
  ctx.arc(x, y, 10, 0, Math.PI * 2);
  ctx.fillStyle = 'yellow';
  ctx.fill();
}

function drawObstacles() {
  obstacles.forEach(o => {
    let x = 250 + Math.cos(o.angle) * 200;
    let y = 250 + Math.sin(o.angle) * 200;

    ctx.beginPath();
    ctx.arc(x, y, 15, 0, Math.PI * 2);
    ctx.fillStyle = 'red';
    ctx.fill();
  });
}

function update() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawMaze();
  drawObstacles();

  player.angle += player.speed;

  if (!player.flying) {
    player.yVel += gravity;
  }

  player.radius += player.yVel;

  if (player.radius > 200) {
    player.radius = 200;
    player.yVel = 0;
  }

  if (player.radius < 150) {
    player.radius = 150;
    player.yVel = 0;
  }

  drawPlayer();

  requestAnimationFrame(update);
}

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') {
    player.yVel = -4; // jump
  }
  if (e.key === ' ') {
    player.flying = true;
    player.yVel = -2;
  }
  if (e.key === 'ArrowDown') {
    player.radius += 10; // dig down
  }
});

window.addEventListener('keyup', e => {
  if (e.key === ' ') {
    player.flying = false;
  }
});

update();
</script>
</body>
</html>
